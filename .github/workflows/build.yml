name: Build Debug APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # google-services.json chứa thông tin dự án Firebase.
      # Lưu nội dung file (dạng base64) vào GitHub Secret tên GOOGLE_SERVICES_JSON_BASE64
      # trước khi chạy workflow này -- xem hướng dẫn trong README.md.
      - name: Restore google-services.json from secret
        run: echo "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" | base64 -d > app/google-services.json

      # Dùng action chính thức của Gradle để tự tải đúng bản Gradle cần thiết,
      # không phụ thuộc vào file gradlew/gradle-wrapper.jar có sẵn trong repo.
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: remote-assist-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
